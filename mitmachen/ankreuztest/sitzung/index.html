<script>
  document.addEventListener('DOMContentLoaded', function () {
    var desktopQuery = window.matchMedia('(min-width: 60em)');

     
    var nav = document.querySelector('.site-nav');
    if (nav) {
      var toggle = nav.querySelector('.nav-toggle');
      var menu = nav.querySelector('#site-menu');

      if (toggle && menu) {
        function closeSubmenus(except) {
          nav.querySelectorAll('.dropdown.is-open').forEach(function (dropdown) {
            if (except && dropdown === except) return;
            dropdown.classList.remove('is-open');
            var btn = dropdown.querySelector('.dropdown-toggle');
            if (btn) btn.setAttribute('aria-expanded', 'false');
          });
        }

        function setOpen(open) {
          nav.classList.toggle('is-open', open);
          toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
          toggle.setAttribute('aria-label', open ? 'Menü schließen' : 'Menü öffnen');
          if (!open) closeSubmenus();
        }

        toggle.addEventListener('click', function () {
          setOpen(!nav.classList.contains('is-open'));
        });

        nav.querySelectorAll('.dropdown-toggle').forEach(function (btn) {
          btn.addEventListener('click', function (event) {
            event.preventDefault();
            event.stopPropagation();
            if (desktopQuery.matches) return;

            var dropdown = btn.closest('.dropdown');
            var willOpen = !dropdown.classList.contains('is-open');
            closeSubmenus(willOpen ? dropdown : null);
            dropdown.classList.toggle('is-open', willOpen);
            btn.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
          });
        });

        document.addEventListener('keydown', function (event) {
          if (event.key === 'Escape') {
            if (nav.querySelector('.dropdown.is-open')) {
              closeSubmenus();
            } else {
              setOpen(false);
            }
          }
        });

        document.addEventListener('click', function (event) {
          if (desktopQuery.matches) return;
          if (!nav.contains(event.target)) {
            closeSubmenus();
            return;
          }
          if (!event.target.closest('.dropdown')) {
            closeSubmenus();
          }
        });

        window.addEventListener('resize', function () {
          if (desktopQuery.matches) {
            setOpen(false);
            closeSubmenus();
          }
        });
      }
    }

     
    var timelines = document.querySelectorAll('[data-year-timeline]');
    if (!timelines.length) return;

    var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var search = window.location.search;
    var host = window.location.hostname;
    var localPreview = host === 'localhost' || host === '127.0.0.1';
    
    
    var forceMotion =
      /(?:\?|&)motion=1(?:&|$)/.test(search) ||
      (localPreview && reduceMotion && !/(?:\?|&)motion=0(?:&|$)/.test(search));
    var animate = !reduceMotion || forceMotion;
    if (forceMotion) document.documentElement.classList.add('force-motion');

    var heroButton = document.querySelector('[data-hero-button]');
    var heroPrompt = document.querySelector('[data-hero-prompt]');

    function show(el) {
      if (el) el.classList.add('is-visible');
    }

    function startHeroSequence(timeline) {
      if (timeline.classList.contains('is-visible')) return;

      if (!animate) {
        show(heroButton);
        show(timeline);
        show(heroPrompt);
        return;
      }

      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          
          show(heroButton);
          setTimeout(function () {
            show(timeline);
            setTimeout(function () {
              show(heroPrompt);
            }, 1400);
          }, 320);
        });
      });
    }

    if (!('IntersectionObserver' in window)) {
      timelines.forEach(startHeroSequence);
      return;
    }

    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (!entry.isIntersecting) return;
        startHeroSequence(entry.target);
        observer.unobserve(entry.target);
      });
    }, { threshold: 0.12, rootMargin: '0px 0px -5% 0px' });

    timelines.forEach(function (timeline) {
      observer.observe(timeline);
    });
  });
</script>
